<h1 class="title">
Ideale (Francesco Paolo Tosti)
</h1>
<p>
自分はテノール歌手の中でも特に Giuseppe di Stefano の明るい声が好きなのですが，
トスティの Ideale（理想）を聞いて深く感動し，自分も挑戦しようと思いました．
</p>
<p>
他の多くの歌手は大きく抑揚をつけて深い悲しみを表現するのですが
Stefano の歌唱は淡々と，しかし力強い声で，
悲しみのその先を感じさせます．
</p>
<p>
音楽の友社「君と旅立とう」収録のイ長調の楽譜を使用します．
</p>

<p>（2016.8.21）</p>
