<h1 class="title">
Gia il sole dal Gange (Alessandro Scarlatti)
</h1>
<p>
スカルラッティによる，朝の黄金に染まる風景を描写した
美しい言葉がちりばめられた曲です．
あふれる自信を感じされるハツラツとしたメロディーも魅力です．
</p>
<p>
全音楽譜出版社，「イタリア歌曲集(1)中声用」
収録の変イ長調の楽譜を使用しました．
</p>

<p>
主にイタリア語の発音の注意をいくつか受けました．これも数回で次の曲へ．
発表会映えする曲なので，いつか発表会に出る機会があれば
この曲を候補に，と考えています．
</p>
