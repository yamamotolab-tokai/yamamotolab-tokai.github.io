<h2>4章章末問題</h2>
<!--
<p>
下記のプログラムは 2 個引数をもつ関数の例である．
単純に 2 個の引数の合計を返す関数である．
</p>

<div class="embox">
<pre>
#!/usr/bin/perl -w
use strict;

my $out;

sub f5{
    my($x, $y) = @_;

    return $x + $y;
}

$out = &f5(1,1);
print "$out\n";
$out = &f5(1,2);
print "$out\n";
</pre>
</div>

<h4>
練習問題4.4
</h4>

返す関数 f6 を作れ．テストするメインルーチンも自分で考えよ．
</p>
